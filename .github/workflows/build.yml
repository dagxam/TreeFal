name: Build - ${{ github.event.head_commit.message || github.event.pull_request.title || 'TreeFall build' }}

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    name: Build Java 26 - ${{ github.event.head_commit.message || github.event.pull_request.title || 'TreeFall' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 26
        uses: oracle-actions/setup-java@v1
        with:
          website: jdk.java.net
          version: '26'

      - name: Verify Java
        run: |
          java -version
          javac -version

      - name: Build with Maven
        run: mvn -B -ntp clean package

      - name: Publish JAR
        uses: actions/upload-artifact@v4
        with:
          name: TreeFall-${{ github.sha }}
          path: target/*.jar
          if-no-files-found: error
          retention-days: 30
