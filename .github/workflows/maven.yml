name: Сборка TreeFall — Java 26

on:
  push:
    branches:
      - "**"

  pull_request:

jobs:
  build:
    name: Сборка плагина на Java 26

    runs-on: ubuntu-latest

    steps:

      - name: Получение исходного кода
        uses: actions/checkout@v4


      - name: Установка JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '26'
          cache: 'maven'


      - name: Проверка Java
        run: |
          echo "========================================"
          echo "Проверка Java"
          echo "========================================"
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version
          echo ""
          echo "Расположение Java:"
          which java
          which javac


      - name: Проверка Maven
        run: |
          echo "========================================"
          echo "Проверка Maven"
          echo "========================================"
          mvn -version


      - name: Очистка проекта
        run: |
          echo "========================================"
          echo "Очистка проекта"
          echo "========================================"
          mvn -B -ntp clean


      - name: Сборка TreeFall
        run: |
          echo "========================================"
          echo "Компиляция TreeFall"
          echo "========================================"
          mvn -B -ntp package


      - name: Проверка готового JAR
        run: |
          echo "========================================"
          echo "Готовый JAR"
          echo "========================================"
          ls -lah target/*.jar


      - name: Загрузка JAR
        uses: actions/upload-artifact@v4
        with:
          name: TreeFall-Java26-${{ github.sha }}
          path: target/*.jar
          if-no-files-found: error
          retention-days: 30
