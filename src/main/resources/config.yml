# TreeFall Configuration
# All technical commands stay in English; messages are configurable below.

enabled: true

authorization:
  require-permission: false
  bypass-permission: treefall.bypass

sneak-to-disable: true
damage-tool: true
require-axe-for-big: false
min-trunk-height: 2
max-blocks: 2000
cooldown-ms: 500
world-blacklist: []

animation:
  # The complete detected falling section is animated up to this safety limit.
  max-falling-blocks: 2000
  blocks-per-tick: 32
  tick-delay: 1
  timeout-ticks: 60
  directional-fall: true
  horizontal-velocity: 0.12
  upward-velocity: 0.02
  random-spread: 0.025
  particles: true
  particle-interval: 2
  sounds: true
  sound-interval: 8

drop:
  chance:
    stick: 0.02
    sapling: 0.05

messages:
  no-permission: "§cУ вас нет прав."
  reload: "§aКонфигурация TreeFall перезагружена."
  usage: "§eИспользование: /treefall reload"
  worldguard-error: "§cНе удалось проверить защиту WorldGuard. TreeFall отключён для этой операции."
