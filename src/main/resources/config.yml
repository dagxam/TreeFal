# TreeFall Configuration

enabled: true

authorization:
  require-permission: false
  bypass-permission: treefall.bypass

sneak-to-disable: false
damage-tool: true
require-axe-for-big: false
min-trunk-height: 1
max-blocks: 512
cooldown-ms: 500
world-blacklist: []

tree-detection:
  ignore-persistent-leaves: true
  max-horizontal-distance: 12
  max-vertical-distance: 48

animation:
  max-falling-blocks: 1000
  blocks-per-tick: 1000
  tick-delay: 1
  timeout-ticks: 140
  adaptive: false
  busy-threshold: 8
  directional-fall: true
  horizontal-velocity: 0.12
  upward-velocity: 0.02
  random-spread: 0.025
  fall-duration-ticks: 24
  fall-angle-degrees: 88.0
  fall-distance: 0.6
  particles: true
  particle-interval: 2
  sounds: true
  sound-interval: 8

drop:
  use-silk-touch: true
  use-fortune: true

  # Сколько блоков листьев выдавать после падения дерева.
  # Листья выдаются как настоящие блоки листьев.
  leaves:
    enabled: true
    amount: 10

  # Случайное количество в указанном диапазоне.
  sticks:
    enabled: true
    min: 4
    max: 10

  saplings:
    enabled: true
    min: 1
    max: 3

  fruits:
    enabled: true
    min: 1
    max: 3

  # Старые параметры оставлены для совместимости.
  chance:
    stick: 0.02
    sapling: 0.05

messages:
  no-permission: "§cУ вас нет прав."
  reload: "§aКонфигурация TreeFall перезагружена."
  usage: "§eИспользование: /treefall reload"
  worldguard-error: "§cTreeFall отменён: дерево пересекает защищённую область."
