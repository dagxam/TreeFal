# TreeFall Configuration

enabled: true

authorization:
  require-permission: false
  bypass-permission: treefall.bypass

sneak-to-disable: false
damage-tool: true
require-axe-for-big: false
min-trunk-height: 1
max-blocks: 512
cooldown-ms: 500
world-blacklist: []

tree-detection:
  ignore-persistent-leaves: true
  max-horizontal-distance: 12
  max-vertical-distance: 48

# Smooth synchronized fall animation.
# All detected tree blocks are removed from the world immediately and represented
# by visual FallingBlock entities. They rotate together and land as one tree.
animation:
  max-falling-blocks: 1000
  blocks-per-tick: 1000
  tick-delay: 1
  timeout-ticks: 140
  adaptive: false
  busy-threshold: 8
  directional-fall: true
  horizontal-velocity: 0.12
  upward-velocity: 0.02
  random-spread: 0.025
  fall-duration-ticks: 24
  fall-angle-degrees: 88.0
  fall-distance: 0.6
  particles: true
  particle-interval: 2
  sounds: true
  sound-interval: 8

drop:
  use-silk-touch: true
  use-fortune: true

  # Exact quantities created when the tree hits the ground.
  # Logs are always dropped according to the number of detected log blocks.
  leaves:
    enabled: true
    amount: 10
  sticks:
    enabled: true
    amount: 3
  saplings:
    enabled: true
    amount: 1
  fruits:
    enabled: true
    amount: 1

  # Kept for compatibility with older configurations.
  chance:
    stick: 0.02
    sapling: 0.05

messages:
  no-permission: "§cУ вас нет прав."
  reload: "§aКонфигурация TreeFall перезагружена."
  usage: "§eИспользование: /treefall reload"
  worldguard-error: "§cTreeFall отменён: дерево пересекает защищённую область."
