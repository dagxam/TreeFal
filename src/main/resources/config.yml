# src/main/resources/config.yml

# TreeFall Configuration

enabled: true

# Require treefall.use permission
require-permission: true

# Sneak (shift) to disable tree-fall and break normally
sneak-to-disable: true

# Damage the tool for each log broken
damage-tool: true

# Require an axe for trees taller than 6 blocks
require-axe-for-big: false

# Minimum trunk height to trigger tree-fall
min-trunk-height: 4

# Maximum blocks to scan for a single tree
max-blocks: 512

# Cooldown between tree-fall activations per player (ms)
cooldown-ms: 500

# Animation settings
animation:
  blocks-per-tick: 18
  tick-delay: 1
  # Max FallingBlock entities spawned per tree (rest just disappear)
  max-falling-blocks: 80

# Drop chances per leaf block
drop:
  chance:
    stick: 0.02
    sapling: 0.05
