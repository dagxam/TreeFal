# TreeFall Configuration

enabled: true

authorization:
  require-permission: false
  bypass-permission: treefall.bypass

# Sneaking no longer disables TreeFall by default.
sneak-to-disable: false
damage-tool: true
require-axe-for-big: false
min-trunk-height: 1
max-blocks: 512
cooldown-ms: 500
world-blacklist: []

tree-detection:
  ignore-persistent-leaves: true
  max-horizontal-distance: 12
  max-vertical-distance: 48

animation:
  # Up to 300 blocks can be animated. Remaining blocks are still removed and
  # their drops are preserved, preventing the tree from leaving blocks behind.
  max-falling-blocks: 300
  blocks-per-tick: 18
  tick-delay: 1
  timeout-ticks: 100
  adaptive: false
  busy-threshold: 8
  directional-fall: true
  horizontal-velocity: 0.12
  upward-velocity: 0.02
  random-spread: 0.025
  particles: true
  particle-interval: 2
  sounds: true
  sound-interval: 8

drop:
  use-silk-touch: true
  use-fortune: true
  chance:
    stick: 0.02
    sapling: 0.05

messages:
  no-permission: "§cУ вас нет прав."
  reload: "§aКонфигурация TreeFall перезагружена."
  usage: "§eИспользование: /treefall reload"
  worldguard-error: "§cTreeFall отменён: дерево пересекает защищённую область."
