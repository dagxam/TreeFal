# TreeFall Configuration

enabled: true

authorization:
  require-permission: false
  bypass-permission: treefall.bypass

sneak-to-disable: false
damage-tool: true
require-axe-for-big: false
min-trunk-height: 1
max-blocks: 5000
cooldown-ms: 500
world-blacklist: []

tree-detection:
  ignore-persistent-leaves: true
  max-horizontal-distance: 12
  max-vertical-distance: 48

# Smooth visual tree fall animation.
animation:
  max-falling-blocks: 5000
  blocks-per-tick: 1000
  tick-delay: 1
  timeout-ticks: 140
  adaptive: false
  busy-threshold: 8
  directional-fall: true
  # true = every tree chooses a new random horizontal direction
  # (forward/back/left/right/diagonal). false = tree falls toward player view.
  random-direction: true
  horizontal-velocity: 0.12
  upward-velocity: 0.02
  random-spread: 0.025
  # 45 ticks ~= 2.25 seconds: slow, natural tipping motion.
  fall-duration-ticks: 45
  # Slightly less than a full 90-degree fall looks more natural.
  fall-angle-degrees: 82.0
  # Extra horizontal movement of the whole tree during the fall.
  fall-distance: 1.6
  particles: true
  particle-interval: 2
  sounds: true
  sound-interval: 8

drop:
  use-silk-touch: true
  use-fortune: true

  # Real leaf blocks created after the falling part hits the ground.
  leaves:
    enabled: true
    amount: 10

  sticks:
    enabled: true
    min: 4
    max: 10

  saplings:
    enabled: true
    min: 1
    max: 3

  fruits:
    enabled: true
    min: 1
    max: 3

  chance:
    stick: 0.02
    sapling: 0.05

messages:
  no-permission: "§cУ вас нет прав."
  reload: "§aКонфигурация TreeFall перезагружена."
  usage: "§eИспользование: /treefall reload"
  worldguard-error: "§cTreeFall отменён: дерево пересекает защищённую область."
