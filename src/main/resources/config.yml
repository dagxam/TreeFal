# TreeFall config

# Master switch
enabled: true

# Require permission "treefall.use"
require-permission: true

# Require an axe in main hand
require-axe: true

# Damage player's tool for each log removed (Unbreaking supported)
damage-tool: true

# Anti-grief: treat only real trees (requires leaves nearby)
require-leaves-nearby: true
leaves-check-radius: 3
leaves-min-count: 6

# Hard cap for logs+leaves collected per tree (lag protection)
max-blocks: 512

effects:
  enabled: true

drop:
  leaf-blocks: true         # если хочешь чтобы листья выпадали как блоки — поставь true
  chance:
    stick: 0.02              # 1–5 палок на дерево, зависит от листьев
    apple: 0.01              # 0–5 яблок на дерево, зависит от листьев
