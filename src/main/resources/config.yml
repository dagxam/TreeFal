# TreeFall Configuration
# Technical commands stay in English; messages are configurable below.

enabled: true

authorization:
  require-permission: true
  bypass-permission: treefall.bypass

sneak-to-disable: true
damage-tool: true
require-axe-for-big: false
min-trunk-height: 4
max-blocks: 512
cooldown-ms: 500
world-blacklist: []

tree-detection:
  # Persistent/player-placed leaves are ignored by default.
  ignore-persistent-leaves: true
  # Safety limits for a single connected tree structure.
  max-horizontal-distance: 12
  max-vertical-distance: 48

animation:
  # Visual FallingBlock limit. Detected blocks are never lost because of this limit.
  max-falling-blocks: 80
  blocks-per-tick: 18
  tick-delay: 1
  timeout-ticks: 100

  # Reduce visual entity count automatically when many TreeFall animations are active.
  adaptive: true
  busy-threshold: 8

  # Push the tree in the direction the player is looking.
  directional-fall: true
  horizontal-velocity: 0.12
  upward-velocity: 0.02
  random-spread: 0.025

  particles: true
  particle-interval: 2
  sounds: true
  sound-interval: 8

drop:
  # Silk Touch makes all detected natural leaves drop as leaf blocks and disables
  # sapling/stick/apple bonus drops, matching the intended vanilla behavior.
  use-silk-touch: true
  # Fortune increases the chance/amount of secondary leaf drops.
  use-fortune: true
  chance:
    stick: 0.02
    sapling: 0.05

messages:
  no-permission: "§cУ вас нет прав."
  reload: "§aКонфигурация TreeFall перезагружена."
  usage: "§eИспользование: /treefall reload"
  worldguard-error: "§cTreeFall отменён: дерево пересекает защищённую область."
