name: TreeFall
version: '1.5.0'
main: me.dagxam.treefall.TreeFallPlugin
api-version: '1.21.1'
description: Realistic tree felling with safe falling animation
author: dagxam
softdepend: [WorldGuard, RealisticSeasons]

commands:
  treefall:
    description: TreeFall admin commands
    usage: /treefall reload
    permission: treefall.admin

permissions:
  treefall.use:
    description: Allows using tree-fall mechanic
    default: true
  treefall.bypass:
    description: Bypasses the TreeFall mechanic
    default: op
  treefall.admin:
    description: Allows reloading TreeFall configuration
    default: op
